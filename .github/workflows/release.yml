name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: moechat-android

      - uses: actions/checkout@v4
        with:
          repository: moechat-ai/msglist
          path: msglist

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 补齐 Android SDK 组件
        run: |
          set -x
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMGR="$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)"
          test -n "$SDKMGR" || { echo "找不到 sdkmanager，SDK=$SDK" >&2; exit 1; }
          yes 2>/dev/null | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: 构建子应用
        run: |
          cd msglist
          npm ci
          npm run build

      # 0.0.1 出的是 debug APK：还没有签名密钥，release 变体产出的未签名包
      # 装了也会被系统拒。等有 keystore 了再换 assembleRelease。
      - name: 构建宿主
        run: |
          cd moechat-android
          ./gradlew :app:assembleDebug --no-daemon

      # 产物落在 moechat-android/ 里面，不在 $GITHUB_WORKSPACE 根上——
      # gh release create 需要 git 仓库上下文，而 workspace 根目录没有 .git
      # （两次 checkout 都在子目录里）。
      - name: 打包
        working-directory: moechat-android
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
             "moechat-android-${GITHUB_REF_NAME}-debug.apk"
          sha256sum moechat-android-*.apk > SHA256SUMS

      - name: 发布
        working-directory: moechat-android
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            moechat-android-*.apk SHA256SUMS \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
